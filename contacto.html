<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - NEXUS Gaming</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="contenedor">

                <h2 class="logo">NEXUS Gaming</h2>

                <div class="menu">
                    <a href="index.html">Inicio</a>
                    <a href="productos.html">Productos</a>
                    <a href="nosotros.html">Nosotros</a>
                    <a href="blog.html">Blog</a>
                    <a href="contacto.html">Contacto</a>
                </div>

                <div class="acciones">
                    <a href="login.html">Iniciar sesión</a>
                    <a href="registro.html">Registrarse</a>
                </div>

            </div>

        </nav>

    </header>


    <main>

        <section class="seccion-formulario">

            <div class="contenedor">

                <div class="formulario-contenedor">

                    <h1>Contacto</h1>

                    <p class="formulario-subtitulo">
                        Envíanos tus consultas o comentarios.
                    </p>


                    <form id="formContacto">

                        <div class="form-group">

                            <label for="nombreContacto">
                                Nombre
                            </label>

                            <input
                                type="text"
                                id="nombreContacto"
                                maxlength="100"
                            >

                            <p
                                class="mensaje-error"
                                id="errorNombreContacto">
                            </p>

                        </div>


                        <div class="form-group">

                            <label for="correoContacto">
                                Correo
                            </label>

                            <input
                                type="email"
                                id="correoContacto"
                                maxlength="100"
                            >

                            <p
                                class="mensaje-error"
                                id="errorCorreoContacto">
                            </p>

                        </div>


                        <div class="form-group">

                            <label for="comentario">
                                Comentario
                            </label>

                            <textarea
                                id="comentario"
                                rows="6"
                                maxlength="500"
                            ></textarea>

                            <p
                                class="mensaje-error"
                                id="errorComentario">
                            </p>

                        </div>


                        <button
                            type="submit"
                            class="btn-formulario"
                        >
                            Enviar mensaje
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <script src="js/contacto.js"></script>

</body>

</html>
