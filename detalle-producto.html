<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle Producto - NEXUS Gaming</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="contenedor">

                <h2 class="logo">
                    NEXUS Gaming
                </h2>

                <div class="menu">
                    <a href="index.html">Inicio</a>
                    <a href="productos.html">Productos</a>
                    <a href="nosotros.html">Nosotros</a>
                    <a href="blog.html">Blog</a>
                    <a href="contacto.html">Contacto</a>
                </div>

                <div class="acciones">
                    <a href="login.html">Iniciar sesión</a>

                    <a href="carrito.html">
                        Carrito (<span id="carritoContador">0</span>)
                    </a>
                </div>

            </div>

        </nav>

    </header>


    <main>

        <section class="detalle-producto">

            <div class="contenedor">

                <a
                    href="productos.html"
                    class="volver-productos"
                >
                    ← Volver a productos
                </a>


                <div class="detalle-producto-contenido">

                    <!-- IMAGEN DEL PRODUCTO -->

                    <div class="detalle-producto-imagen">

                        <img
                            id="detalleImagen"
                            src=""
                            alt=""
                        >

                    </div>


                    <!-- INFORMACIÓN DEL PRODUCTO -->

                    <div class="detalle-producto-info">

                        <p
                            class="categoria-producto"
                            id="detalleCategoria"
                        >
                        </p>


                        <h1 id="detalleNombre">
                        </h1>


                        <p
                            class="detalle-precio"
                            id="detallePrecio"
                        >
                        </p>


                        <p
                            class="detalle-descripcion"
                            id="detalleDescripcion"
                        >
                        </p>


                        <div class="form-group">

                            <label for="cantidad">
                                Cantidad
                            </label>

                            <input
                                type="number"
                                id="cantidad"
                                value="1"
                                min="1"
                                max="10"
                            >

                        </div>


                        <button
                            id="btnAgregarCarrito"
                            class="btn-formulario"
                        >
                            Agregar al carrito
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- JS DEL DETALLE -->

    <script src="js/detalle-producto.js"></script>

</body>

</html>
