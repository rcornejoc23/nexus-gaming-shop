<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Iniciar sesión - NEXUS Gaming
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <nav class="navbar">
    <div class="contenedor">
     <h2 class="logo">
      NEXUS Gaming
     </h2>
     <div class="menu">
      <a href="index.html">
       Inicio
      </a>
      <a href="productos.html">
       Productos
      </a>
      <a href="nosotros.html">
       Nosotros
      </a>
      <a href="blog.html">
       Blog
      </a>
      <a href="contacto.html">
       Contacto
      </a>
     </div>
     <div class="acciones">
      <a href="registro.html">
       Registrarse
      </a>
     </div>
    </div>
   </nav>
  </header>
  <main>
   <section class="seccion-formulario">
    <div class="contenedor">
     <div class="formulario-contenedor">
      <h1>
       Iniciar sesión
      </h1>
      <p class="formulario-subtitulo">
       Ingresa a tu cuenta de NEXUS Gaming.
      </p>
      <form id="formLogin">
       <div class="form-group">
        <label for="correoLogin">
         Correo
        </label>
        <input id="correoLogin" maxlength="100" type="email"/>
        <p class="mensaje-error" id="errorCorreoLogin">
        </p>
       </div>
       <div class="form-group">
        <label for="password">
         Contraseña
        </label>
        <input id="password" maxlength="10" minlength="4" type="password"/>
        <p class="mensaje-error" id="errorPassword">
        </p>
       </div>
       <button class="btn-formulario" type="submit">
        Iniciar sesión
       </button>
      </form>
      <p class="formulario-footer">
       ¿No tienes cuenta?
       <a href="registro.html">
        Regístrate
       </a>
      </p>
     </div>
    </div>
   </section>
  </main>
  <script src="js/login.js">
  </script>
 </body>
</html>
